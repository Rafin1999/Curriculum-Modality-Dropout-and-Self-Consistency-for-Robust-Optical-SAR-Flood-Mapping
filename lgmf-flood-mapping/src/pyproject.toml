[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lgmf"
version = "7.0.0"
description = "Curriculum modality dropout and self-consistency for robust optical-SAR flood mapping"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.10",
    "timm==1.0.28",
    "segmentation-models-pytorch==0.5.0",
    "rasterio>=1.5.0",
    "numpy>=2.0",
    "matplotlib>=3.10",
]

[tool.setuptools]
packages = ["lgmf"]
